services:
  api:
    build:
      context: .
      target: api
    image: adpulse-api:production
    env_file:
      - /etc/adpulse/adpulse.env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "4000"
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/auth/me').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      target: web
    image: adpulse-web:production
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  migrate:
    image: adpulse-api:production
    profiles: ["tools"]
    env_file:
      - /etc/adpulse/adpulse.env
    environment:
      NODE_ENV: production
    command: ["node", "apps/api/scripts/migrate.cjs"]
    restart: "no"

networks:
  default:
    name: adpulse-production
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.240.0/24
          gateway: 172.29.240.1
