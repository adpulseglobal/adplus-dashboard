name: Validate and deploy AdPulse

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Build API
        run: npm run build:api

  deploy:
    name: Deploy production
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: adpulse-production
      cancel-in-progress: false
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
      VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/adpulse-ssh"
          printf '%s' "$VM_SSH_PRIVATE_KEY" | tr -d '\r' > "$RUNNER_TEMP/adpulse-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/adpulse-ssh/id_ed25519"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/adpulse-ssh/known_hosts"
          if ! ssh-keygen -y -f "$RUNNER_TEMP/adpulse-ssh/id_ed25519" >/dev/null; then
            echo "::error::VM_SSH_PRIVATE_KEY must contain the complete, unencrypted private key file without the .pub extension."
            exit 1
          fi

      - name: Pull, migrate, and restart on the VM
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$RUNNER_TEMP/adpulse-ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/adpulse-ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" "bash -se -- '$GITHUB_SHA'" <<'REMOTE'
          set -Eeuo pipefail
          expected_sha="$1"
          app_dir="/opt/adpulse-dashboard/adplus-dashboard"
          cd "$app_dir"

          git checkout main
          git pull --ff-only origin main
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "VM checkout does not match the workflow commit."
            exit 1
          fi

          compose=(sudo -n docker compose -f compose.production.yaml -p adpulse)
          "${compose[@]}" config --quiet
          # Rebuild from the checked-out commit so cached build layers cannot
          # leave the container serving static chunks from an earlier deploy.
          "${compose[@]}" build --pull --no-cache

          built_web_image="$(sudo -n docker image inspect --format '{{.Id}}' adpulse-web:production)"
          if ! sudo -n docker run --rm --entrypoint sh "$built_web_image" -lc \
            "grep -R -q 'Performance Dashboard' /app/.next/static/chunks"; then
            echo "New frontend image does not contain the expected dashboard bundle."
            exit 1
          fi
          echo "Built frontend image $built_web_image contains the expected dashboard bundle for $actual_sha."

          "${compose[@]}" --profile tools run --rm migrate
          "${compose[@]}" up -d --force-recreate api web
          "${compose[@]}" ps

          web_container="$("${compose[@]}" ps -q web)"
          if [ -z "$web_container" ]; then
            echo "Frontend container was not created."
            exit 1
          fi
          built_web_image="$(sudo -n docker image inspect --format '{{.Id}}' adpulse-web:production)"
          running_web_image="$(sudo -n docker inspect --format '{{.Image}}' "$web_container")"
          if [ "$running_web_image" != "$built_web_image" ]; then
            echo "Frontend container is not using the image built by this deployment."
            exit 1
          fi
          echo "Running frontend container $web_container uses image $running_web_image."

          running_bundle="$(sudo -n docker exec "$web_container" sh -lc \
            "grep -Rl 'Performance Dashboard' /app/.next/static/chunks | head -1")"
          if [ -z "$running_bundle" ]; then
            echo "Running frontend container does not contain the expected dashboard bundle."
            exit 1
          fi
          echo "Verified updated dashboard bundle in running container: $running_bundle"

          bundle_url="${running_bundle#/app}"
          served_bundle="$(curl -fsS "http://127.0.0.1:3000$bundle_url")"
          if [[ "$served_bundle" != *"Performance Dashboard"* ]]; then
            echo "Frontend HTTP endpoint is not serving the expected dashboard bundle."
            exit 1
          fi
          echo "Verified updated dashboard bundle is served over HTTP: $bundle_url"

          web_code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login)"
          if [ "$web_code" != "200" ]; then
            echo "Frontend health check failed with HTTP $web_code."
            exit 1
          fi

          api_code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/auth/me)"
          case "$api_code" in
            200|401) ;;
            *) echo "API health check failed with HTTP $api_code."; exit 1 ;;
          esac
          REMOTE
